<style>

:root {
  --color-correct: #10b981;
  --color-incorrect: #ef4444;
  --color-partial: #eab308;
  --color-omitted: #6b7280;
  --current-color: var(--color-correct);
  --navy: #0067A9;       
  --navy-light: #7cafe8; 
  --google-blue: #0066CC;
  --calc-red: #8b0000;
  --calc-blue: #004080;
  --glass: rgba(255, 255, 255, 0.8);
  --bg-main: #eef3f8;
  --bg-left: #ffffff;
  --bg-right: #ffffff;
  --text-main: #111111;
  --border-color: #ffffff;
}

/* Google Material Symbols Icons */
.material-symbols-outlined,
.google-icon {
  font-family: 'Material Symbols Outlined';
  font-weight: normal;
  font-style: normal;
  font-size: 1.1em;
  line-height: 1;
  letter-spacing: normal;
  text-transform: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  white-space: nowrap;
  word-wrap: normal;
  direction: ltr;
  -webkit-font-feature-settings: 'liga';
  -webkit-font-smoothing: antialiased;
  font-feature-settings: 'liga';
  vertical-align: -0.18em;
}
.google-icon {
  margin-right: 4px;
}
.inline-google-icon {
  margin-right: 4px;
  vertical-align: -0.2em;
}
.icon-only .google-icon,
.action-icon-btn .google-icon,
#calc-close .google-icon,
.speaker-icon.google-icon {
  margin-right: 0;
}
.status-label .google-icon {
  margin-left: 4px;
  margin-right: 0;
  font-size: 18px;
}
.strip-btn > span,
.bottombar button,
.result-item,
.ai-header > span:first-child {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.speaker-icon.google-icon {
  cursor: pointer;
  margin-left: 8px;
  font-size: 1.25em;
}

/* Enable text selection everywhere by default for questions, explanations, options, and tables */
body, .left, #rightPanel, .qtext, #question, #explanation, #caseStudyContainer, .option, table, td, th, .tab-content {
  -webkit-user-select: text;
  -moz-user-select: text;
  -ms-user-select: text;
  user-select: text;
}

/* Disable text selection on UI controls and buttons */
button, .strip-btn, .topbar, .bottombar, .calc-strip, input, select, .material-symbols-outlined, .google-icon {
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
}

*{ box-sizing:border-box; }

body{
  margin:0;
  font-family: Helvetica Neue, Arial,  sans-serif;
  background:#eef3f8;
  overflow:hidden;
  transition: background-color 0.5s ease, color 0.5s ease;
  line-height: 1.6;
}

/* Night Mode Theme */
body.night-mode {
  --navy: #1a1a1a;
  --navy-light: #161616;
  --glass: rgba(30, 30, 50, 0.85);
  --bg-main: #0a0a14;
  --bg-left: #121212;
  --bg-right: #0f0f0f;
  --text-main: #e0e0e0;
  --border-color: #2a2a2a;
  background: var(--bg-main);
}

body.night-mode .topbar,
body.night-mode .bottombar {
  background: linear-gradient(180deg, #1d1d1d 0%, #141414 100%);
  border-bottom-color: #2a2a2a;
}

body.night-mode .calc-strip {
  background: linear-gradient(180deg, #1d1d1d 0%, #1a1a1a 100%);
  border-bottom-color: #2a2a2a;
  border-left-color: #2a2a2a;
  border-right-color: #2a2a2a;
}

body.night-mode .left {
  background: var(--bg-left);
  box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
}

body.night-mode #rightPanel {
  background: var(--bg-left) !important;
  box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
}

body.night-mode .divider {
  background: #666666;
}

body.night-mode .nav-link {
  background-color: #1a1a1a;
  color: #a0a0c0;
  border-color: #2a2a2a;
}

body.night-mode .nav-link:hover {
  background-color: #252525;
}

body.night-mode .nav-link.active {
  background-color: #0f0f0f;
  color: #e0e0e0;
  border-color: #2a2a2a #2a2a2a #0f0f0f;
}

body.night-mode .tab-content {
  background: #121212;
  border-color: #2a2a2a;
  color: #e0e0e0;
}

body.night-mode table th {
  background-color: #ff6161;
  color: #e0e0e0;
}

body.night-mode table td {
  background: #121212;
  border-color: #2a2a2a;
  color: #c0c0c0;
}

body.night-mode .qtext,
body.night-mode #question,
body.night-mode #caseStudyContainer {
  color: #e0e0e0;
  padding: 10px;
}

body.night-mode .ngn-select {
  background: #1a1a1a;
  color: #e0e0e0;
  border-color: #3a3a3a;
}

body.night-mode .ngn-dropdown-select {
  background: linear-gradient(to bottom, #1a1a1a 0%, #121212 100%);
  color: #e0e0e0;
  border-color: #3a3a3a;
}

body.night-mode .ngn-element-container {
  background: linear-gradient(135deg, #1a1a1a 0%, #121212 100%);
  border-color: #2a2a2a;
}

body.night-mode .ngn-interactive-table td {
  background: #121212;
  border-color: #2a2a2a;
}

body.night-mode .ngn-interactive-table tr:hover td {
  background: #1a1a1a;
}

body.night-mode .strip-separator,
body.night-mode .footer-separator {
  background: #3a3a3a;
}

body.night-mode .option::before {
  background: #2a2a2a;
  border-color: #4a4a4a;
}

body.night-mode #calculator {
  background: #1a1a1a;
}

body.night-mode #calc-header {
  background: linear-gradient(180deg, #1a1a1a 0%, #0f0f0f 100%);
  color: #e0e0e0;
}

body.night-mode #calc-display {
  background: #0f0f0f;
  color: #e0e0e0;
}

body.night-mode .calc-btn {
  background: #2a2a2a;
  color: #e0e0e0;
}

body.night-mode .calc-btn.op {
  background: #8b0000;
}

body.night-mode .calc-btn.eq {
  background: #004080;
}

body.night-mode ::-webkit-scrollbar {
  width: 10px;
}

body.night-mode ::-webkit-scrollbar-track {
  background: #1a1a1a;
}

body.night-mode ::-webkit-scrollbar-thumb {
  background: #3a3a3a;
  border-radius: 5px;
}

body.night-mode ::-webkit-scrollbar-thumb:hover {
  background: #4a4a4a;
}

body.night-mode #aiModal {
  background: rgba(20, 20, 35, 0.9);
}

body.night-mode .ai-header {
  background: linear-gradient(180deg, #1a1a1a 0%, #0f0f0f 100%);
}

.night-toggle-strip {
  cursor: pointer;
  font-size: 16px;
  opacity: 0.9;
  transition: opacity 0.3s ease;
}

.night-toggle-strip:hover {
  opacity: 0.7;
}

/* TOP BAR */
.topbar{
  height:68px;
  background:var(--navy);
  color:white;
  padding:0 14px;
  display:grid;
  grid-template-columns:minmax(260px, 1fr) auto minmax(260px, 1fr);
  align-items:center;
  border-bottom:2px solid white;
  transition: background-color 0.5s ease, color 0.5s ease;
}
.top-left{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
  font-size:15px;
  font-weight:800;
  white-space:nowrap;
}
.top-left-title{
  display:flex;
  align-items:center;
  gap:4px;
  min-width:0;
  font-weight:700;
}
.top-left-badge{
  display:none;
}

@keyframes metalGlare {
  0% { color: white; text-shadow: 0 0 5px rgba(255, 255, 255, 0.3); }
  25% { color: #FFD700; text-shadow: 0 0 15px rgba(255, 255, 0, 0.8), 0 0 30px rgba(255, 255, 0, 0.6); }
  50% { color: white; text-shadow: 0 0 20px rgba(255, 255, 255, 0.9), 0 0 80px rgba(255, 255, 255, 0.7); }
  75% { color: #FFD700; text-shadow: 0 0 150px rgba(255, 255, 0, 0.8), 0 0 300px rgba(255, 255, 0, 0.6); }
  100% { color: white; text-shadow: 0 0 5px rgba(255, 255, 255, 0.3); }
}
.top-left.glare-active {
  animation: metalGlare 6s ease-in-out infinite;
}

@keyframes glarYellowRed {
  0% { color: inherit; text-shadow: 0 0 2px rgba(255, 255, 0, 0.3); }
  25% { color: #FFD700; text-shadow: 0 0 10px rgba(255, 255, 0, 0.8), 0 0 20px rgba(255, 215, 0, 0.6); }
  50% { color: #FFA500; text-shadow: 0 0 15px rgba(255, 165, 0, 0.8), 0 0 25px rgba(255, 140, 0, 0.6); }
  75% { color: #f8a98c; text-shadow: 0 0 15px rgba(255, 69, 0, 0.8), 0 0 25px rgba(255, 114, 142, 0.644); }
  100% { color: inherit; text-shadow: 0 0 2px rgba(255, 94, 94, 0.555); }
}

.pbx-glare {
  animation: glarYellowRed 3s ease-in-out infinite;
  font-weight: bold;
  display: inline-block;
}
.top-center{
  justify-self:center;
  text-align:center;
  color:white;
  font-weight:700;
  line-height:1.2;
}
.top-center .meta-line{
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}
.top-center .qid-line{
  font-size:14px;
  margin-top:4px;
  font-weight:700;
}

#typewriter { display:none; }
.cursor-blink { animation: blink 0.7s infinite; }
@keyframes blink { 50% { border-color: transparent; } }

.top-right{
  justify-self:end;
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:5px;
}
.status-row{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:15px;
  line-height:0.8;
  color:white;
  cursor:pointer;
  padding:1px 0;
  border:none;
  font-weight:700;
  transition: color 0.2s ease;
}
.status-label{
  min-width:72px;
  text-align:right;
  font-weight:700;
}
.status-value{
  font-weight:700;
  white-space:nowrap;
}
.status-row:hover{ color:#ffe45c; }

/* CALC STRIP */
.calc-strip{
  height:40px;
  background:var(--navy-light);
  color:white;
  padding:0 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:15px;
  font-weight:700;
  transition: background-color 0.5s ease, color 0.5s ease;
}
.calc-left, .calc-right{
  display:flex;
  align-items:center;
  gap:0;
}
.calc-center{ display:none; }

.strip-btn{
  height:auto;
  display:inline-flex;
  align-items:center;
  gap:0;
  padding:0 12px;
  border:none;
  background:transparent;
  color:white;
  font-size:17px;
  font-weight:700;
  cursor:pointer;
  transition: color 0.2s ease;
}
.strip-btn:hover{ color:#ffe45c; background:transparent; }
.practice-mode-btn{
  min-width:112px;
  justify-content:center;
  border-left:2px solid #ffffff;
  margin-left:2px;
}
.practice-mode-btn .mode-dot{
  width:8px;height:8px;border-radius:50%;background:#60d394;display:inline-block;margin-right:7px;box-shadow:0 0 0 2px rgba(255,255,255,.2);
}
.practice-mode-btn.untutored .mode-dot{background:#ffd166;}
body.untutored-mode .check-btn,
body.untutored-mode .mobile-check-cell{display:none !important;}
body.untutored-mode .mobile-bottombar{grid-template-columns:1fr 1fr;}
body.untutored-mode .main:not(.review-active) #rightPanel{display:none !important;}
body.untutored-mode .main:not(.review-active){grid-template-columns:1fr 0 0 !important;}
body.review-mode .check-btn,
body.review-mode .mobile-check-cell{display:none !important;}
body.review-mode .mobile-bottombar{grid-template-columns:1fr 1fr;}
body.review-mode #practiceModeBtn,
body.review-mode #mobilePracticeModeBtn{display:none !important;}
/* Review is read-only: keep question count, but remove elapsed time from both top bars. */
body.review-mode .top-right .status-row:first-child,
body.review-mode .mobile-status-block .mobile-status-row:first-child{display:none !important;}
.action-icon-btn{ justify-content:center; padding:0 14px; }
.utility-btn{ font-size:18px; }
.strip-separator{
  width:2px;
  height:40px;
  background:#ffffff;
  display:inline-block;
  margin:0 2px;
  flex:0 0 2px;
}
.hidden-file-input{ display:none !important; }
.mark-review-btn.is-marked{ color:#ffe45c; }

#questionCounter { font-weight:700; font-size:15px; }

/* CASE STUDY TABS STYLING */
#caseStudyContainer {
  margin-bottom: 20px;
  border-bottom: 4px solid #eef3f8;
  padding: 15px;
  display: none;
  font-size: 16px;
  line-height: 1.8;
  color: #333;
  font-weight: 500;
}
.nav-tabs {
  display: flex;
  flex-wrap: wrap;
  padding-left: 0;
  margin-bottom: 0;
  list-style: none;
  border-bottom: 1px solid #dee2e6;
}
.nav-item { margin-bottom: -1px; }
.nav-link {
  display: block;
  padding: 8px 16px;
  border: 1px solid transparent;
  border-top-left-radius: 4px;
  border-top-right-radius: 4px;
  text-decoration: none;
  color: var(--navy);
  background-color: #f8f9fa;
  cursor: pointer;
  font-size: 13px;
  font-weight: bold;
  margin-right: 2px;
}
.nav-link:hover { border-color: #e9ecef #e9ecef #dee2e6; }
.nav-link.active {
  color: #495057;
  background-color: #fff;
  border-color: #dee2e6 #dee2e6 #fff;
}
.tab-content { padding: 15px; border: 1px solid #dee2e6; border-top: none; font-size: 16px; line-height: 1.8; }
.tab-pane { display: none; }
.tab-pane.active { display: block; animation: fadeIn 0.3s; }
@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }

table { border-collapse: collapse; width: 100%; font-size: 13px; margin: 10px 0; }
th, td { border: 1px solid #dee2e6; padding: 8px; text-align: left; }
th { background-color: #f1f3f5; }
select.ngn-select {
  padding: 5px; border: 1px solid var(--navy); border-radius: 4px; background: #eef; font-weight: bold; max-width: 100%;
}

/* MAIN LAYOUT */
.main{
  /* 68px desktop top bar + 40px utility strip + 40px fixed lower bar. */
  height:calc(100vh - 68px - 40px - 40px);
  display:grid;
  grid-template-columns:1fr 0 0;
}

.left, #rightPanel{
  overflow-y:auto;
  overflow-x:hidden;
  padding:24px;
  padding-bottom: 60px;
  transition: background-color 0.5s ease, color 0.5s ease;
}
.left{ background:white; }
#rightPanel{ background:white !important; display: none; }

.divider {
  height: 100%;
  width: 1px;
  background: #888888;
  user-select: none;
  pointer-events: none;
  display: none;
}

.main.show-result { grid-template-columns: 1fr 1px 1fr; }
.main.show-result .divider,
.main.show-result #rightPanel { display: block; }

/* Make images clickable in question/explanation areas */
.left img, #rightPanel img {
  max-width: 100%;
  height: auto;
  display: block;
  margin: 15px 0;
  cursor: zoom-in;
  transition: opacity 0.2s;
}
.left img:hover, #rightPanel img:hover {
  opacity: 0.92;
}

/* ====================================================
   CUSTOM CONTEXT MENU (HIGHLIGHT & NOTEBOOK)
   ==================================================== */
#customContextMenu {
  display: none;
  position: fixed;
  z-index: 99999;
  background: #ffffff;
  border: 1px solid #cbd5e1;
  border-radius: 6px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.15);
  padding: 4px;
  font-size: 14px;
  font-weight: 500;
  color: #1e293b;
  min-width: 180px;
}
#customContextMenu.active {
  display: flex;
  flex-direction: column;
}
.context-menu-item {
  padding: 8px 12px;
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  border-radius: 4px;
  background: transparent;
  border: none;
  width: 100%;
  text-align: left;
  color: inherit;
  font-size: 14px;
}
.context-menu-item:hover {
  background: #f1f5f9;
}
body.night-mode #customContextMenu {
  background: #1e1e1e;
  border-color: #333;
  color: #e0e0e0;
  box-shadow: 0 10px 25px rgba(0,0,0,0.5);
}
body.night-mode .context-menu-item:hover {
  background: #2a2a2a;
}

/* Bright Yellow User Highlight Styling */
.user-highlight {
  background-color: #ffff00;
  color: #111111;
  padding: 2px 0;
  border-radius: 2px;
}
body.night-mode .user-highlight {
  background-color: #facc15;
  color: #111111;
}
/* ==================================================== */

/* ====================================================
   EXHIBIT DISPLAY MODAL (IMAGE ZOOM & SCROLL VIEWER)
   ==================================================== */
#exhibitModal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 99999;
  background: rgba(0, 0, 0, 0.65);
  align-items: center;
  justify-content: center;
  padding: 20px;
}
#exhibitModal.active {
  display: flex;
}
.exhibit-dialog {
  width: min(1040px, 96vw);
  height: min(800px, 92vh);
  background: #ffffff;
  border-radius: 8px;
  box-shadow: 0 25px 50px rgba(0,0,0,0.35);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border: 2px solid var(--navy);
}
.exhibit-header {
  background: var(--navy);
  color: #ffffff;
  padding: 14px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 16px;
  font-weight: 600;
}
.exhibit-close-btn {
  background: transparent;
  border: none;
  color: #ffffff;
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2px;
  border-radius: 4px;
}
.exhibit-close-btn:hover {
  background: rgba(255,255,255,0.15);
}
.exhibit-body {
  flex: 1;
  position: relative;
  background: #f8fafc;
  overflow: auto;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: grab;
}
.exhibit-body:active {
  cursor: grabbing;
}
.exhibit-img-wrap {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 30px;
  min-width: 100%;
  min-height: 100%;
}
#exhibitImage {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  transition: transform 0.1s ease-out;
  transform-origin: center center;
  user-select: none;
  pointer-events: none;
}
.exhibit-footer {
  background: #ffffff;
  border-top: 1px solid #e2e8f0;
  padding: 10px 18px;
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 12px;
}
.exhibit-btn {
  background: transparent;
  border: 1px solid #cbd5e1;
  color: #334155;
  padding: 6px 14px;
  font-size: 14px;
  font-weight: 600;
  border-radius: 4px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: background 0.2s, border-color 0.2s;
}
.exhibit-btn:hover {
  background: #f1f5f9;
  border-color: #94a3b8;
}
.exhibit-btn .google-icon {
  font-size: 18px !important;
  margin: 0 !important;
}

body.night-mode .exhibit-dialog {
  background: #121212;
  border: 2px solid var(--border-color);
}
body.night-mode .exhibit-header {
  background: var(--navy);
}
body.night-mode .exhibit-body {
  background: #0b0b10;
}
body.night-mode .exhibit-footer {
  background: #161616;
  border-top-color: #2a2a2a;
}
body.night-mode .exhibit-btn {
  background: #222;
  border-color: #3a3a3a;
  color: #e0e0e0;
}
body.night-mode .exhibit-btn:hover {
  background: #2a2a2a;
}
/* ==================================================== */

.blue-search {
  color: var(--google-blue);
  text-decoration: underline;
  cursor: pointer;
  font-weight: 600;
}
body.night-mode .blue-search { color: #6fa8dc; }
body.night-mode #explanation { color: #e0e0e0; }

/* Additional text shown below the main explanation */
.additional-text-box {
  margin-top: 16px;
  padding: 14px 16px;
  background: #f1f3f5;
  border: 1px solid #d9dee3;
  border-radius: 7px;
  color: #000000;

/* OPTIONS */
.option {
  border: none !important;
  padding: 10px 5px 10px 59px;
  margin-bottom: 8px;
  cursor: default;
  position: relative;
  background: transparent !important;
  color: #000000;
  box-shadow: none !important;
  line-height: 1.3;
}
body.night-mode .option {
  color: #e0e0e0;
}
.option::before {
  content: "";
  width: 22px;
  height: 22px;
  border: 2px solid #ffffff;
  border-radius: 4px;
  position: absolute;
  left: 29px;
  top: 50%;
  transform: translateY(-50%);
  background: #ffffff;
  box-shadow: inset 0 0 0 1px #41414154;
}
body.night-mode .option::before {
  border-color: #41414154;
  background: #41414154;
  box-shadow: inset 0 0 0 2px #ffffff;
}
.option.selected::before {
  background: #92c5ff;
  border-color: #ffffff;
  box-shadow: inset 0 0 0 1px #41414154, inset 0 0 0 4px #ffffff;
}
body.night-mode .option.selected::before {
  background: #304961;
  border-color: #000000a4;
  box-shadow: inset 0 0 0 1px #ffffff, inset 0 0 0 4px #1a1a2e;
}

.option.correct::after,
.option.wrong::after {
  font-family: 'Material Symbols Outlined';
  position: absolute;
  left: 0px;
  top: 50%;
  transform: translateY(-50%);
  width: 26px;
  height: 26px;
  line-height: 26px;
  text-align: center;
  font-size: 26px;
  font-weight: 400;
}
.option.correct::after { content: "check"; color: #1bad22; }
.option.wrong::after { content: "close"; color: #ff2828; }

/* ====================================================
   VERTICALLY SPACE ADAPTIVE RESULT BOX STYLING (Space-Efficient)
   ==================================================== */
#questionResultBox {
  position: relative;
  background: #ffffff;
  border-radius: 10px;
  padding: 16px 20px;
  border: 2px solid #e2e8f0;
  box-shadow: 0 8px 20px -4px rgba(0, 0, 0, 0.08);
  display: none;
  margin-top: 15px;
  overflow: hidden;
  height: auto;
}

.border-svg {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  overflow: visible;
  border-radius: 10px;
}

.anim-rect {
  fill: none;
  stroke: var(--current-color);
  stroke-width: 3px;
  opacity: 0;
}

.anim-rect.animate {
  animation: borderTrace 0.75s cubic-bezier(0.4, 0, 0.2, 1) forwards;
}

@keyframes borderTrace {
  0% {
    stroke-dashoffset: var(--path-length);
    opacity: 1;
  }
  95% {
    opacity: 1;
  }
  100% {
    stroke-dashoffset: 0;
    opacity: 0;
  }
}

.arrow-marker {
  fill: var(--current-color);
}

.result-title {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 12px;
  color: var(--current-color);
}

.result-row {
  display: flex;
  justify-content: space-between;
  padding: 7px 0;
  border-bottom: 1px solid var(--current-color);
  font-size: 14px;
  color: #1e293b;
  transition: border-color 0.3s ease;
}

.result-row:last-child {
  border-bottom: none;
}

body.night-mode #questionResultBox {
  background: #1a1a1a !important;
  border: 2px solid #2a2a2a !important;
  box-shadow: 0 8px 20px -4px rgba(0, 0, 0, 0.4) !important;
}

      <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>

<script>
(() => {
  'use strict';

  const desktopInput = document.getElementById('teacherQidInput');
  const mobileInput = document.getElementById('teacherQidInputMobile');
  const desktopBtn = document.getElementById('teacherSearchBtn');
  const mobileBtn = document.getElementById('teacherSearchBtnMobile');
  const metaDesktop = document.getElementById('teacherMetaDesktop');
  const metaMobile = document.getElementById('teacherMetaMobile');
  const questionEl = document.getElementById('question');
  const optionsEl = document.getElementById('options');
  const explanationEl = document.getElementById('explanation');
  const mainEl = document.querySelector('.main');

  let bankPromise = null;
  let questionIndex = new Map();
  let currentZoom = 1;

  const normaliseQid = value => String(value ?? '')
    .trim()
    .replace(/^qid\s*[:#-]?\s*/i, '')
    .replace(/\s+/g, '');

  function listFrom(data) {
    if (Array.isArray(data)) return data;
    if (data && Array.isArray(data.questionList)) return data.questionList;
    return [];
  }

  function clearNotFoundState() {
    [desktopInput, mobileInput].forEach(el => {
      if (!el) return;
      el.classList.remove('not-found');
      el.removeAttribute('aria-invalid');
    });
  }

  function clearSearchBoxes() {
    if (desktopInput) desktopInput.value = '';
    if (mobileInput) mobileInput.value = '';
    clearNotFoundState();
  }

  function setLoadedMeta(qid, packName) {
    const line = qid ? `QID: ${qid}${packName ? `  •  ${packName}` : ''}` : '';
    if (metaDesktop) metaDesktop.textContent = line;
    if (metaMobile) metaMobile.textContent = line;
  }

  function markNotFound(input) {
    if (!input) return;
    input.classList.add('not-found');
    input.setAttribute('aria-invalid', 'true');
    input.focus();
    input.select();
  }

  async function buildBank() {
    if (bankPromise) return bankPromise;
    bankPromise = (async () => {
      const catalogResponse = await fetch('data/tests.json', { cache: 'no-store' });
      if (!catalogResponse.ok) throw new Error('Question catalog unavailable');
      const catalog = await catalogResponse.json();
      const packs = Array.isArray(catalog) ? catalog : [];
      const results = await Promise.allSettled(packs.map(async pack => {
        const response = await fetch(pack.file, { cache: 'no-store' });
        if (!response.ok) throw new Error(pack.file);
        const data = await response.json();
        return { pack, questions: listFrom(data) };
      }));

      const index = new Map();
      results.forEach(result => {
        if (result.status !== 'fulfilled') return;
        result.value.questions.forEach(q => {
          const key = normaliseQid(q.questionId ?? q.questionIndex);
          if (key && !index.has(key)) index.set(key, { question: q, pack: result.value.pack });
        });
      });
      questionIndex = index;
      return questionIndex;
    })();
    return bankPromise;
  }

  function formatExplanation(value) {
    if (!value) return '';
    let text = String(value).replace(/\((Option|Options)[^)]+\)/gi, match => `<span class="opt-gap"><b>${match}</b></span>`);
    text = text.replace(/<a[^>]*>(.*?)<\/a>/gi, '$1');
    return text;
  }

  function correctIndexes(q) {
    return String(q.correctAnswer || '')
      .split(',')
      .map(v => Number(v.trim()) - 1)
      .filter(v => Number.isInteger(v) && v >= 0);
  }

  function renderQuestion(record) {
    const q = record.question;
    const correct = new Set(correctIndexes(q));
    const choices = Array.isArray(q.answerChoiceList) ? q.answerChoiceList : [];

    questionEl.innerHTML = q.questionText || '';
    optionsEl.replaceChildren();

    choices.forEach((choice, index) => {
      const row = document.createElement('div');
      row.className = 'option';
      if (correct.has(index)) row.classList.add('selected', 'correct');
      row.innerHTML = choice && typeof choice.choice === 'string' ? choice.choice : '';
      optionsEl.appendChild(row);
    });

    const additional = typeof q.additionalText === 'string' ? q.additionalText.trim() : '';
    const additionalBox = additional ? `<div class="additional-text-box">${formatExplanation(additional)}</div>` : '';
    explanationEl.innerHTML = `
      <div class="exp-title"><strong>Explanation</strong></div>
      <div class="correct-exp">${formatExplanation(q.explanationText || '')}</div>
      ${additionalBox}
      <div class="exp-meta">
        <div class="exp-topic">${q.topic || 'General'}</div>
        <div class="exp-subject">NCSBN ${q.subject || 'General'}</div>
      </div>`;

    const loadedQid = String(q.questionId ?? q.questionIndex ?? '').trim();
    const packName = String(record.pack?.title ?? record.pack?.name ?? record.pack?.id ?? '').trim();
    setLoadedMeta(loadedQid, packName);
    clearSearchBoxes();

    mainEl.classList.add('show-result');
    const left = document.querySelector('.left');
    const right = document.getElementById('rightPanel');
    if (left) left.scrollTop = 0;
    if (right) right.scrollTop = 0;
    mainEl.scrollTop = 0;

    document.title = `TEACHING CONSOLE — QID ${loadedQid}`;
  }

  async function searchQuestion(input, button) {
    const key = normaliseQid(input?.value);
    if (!key) {
      input?.focus();
      return;
    }

    clearNotFoundState();
    [desktopBtn, mobileBtn].forEach(btn => { if (btn) btn.disabled = true; });
    if (button) button.textContent = '...';

    try {
      const index = await buildBank();
      const record = index.get(key);
      if (!record) {
        markNotFound(input);
        return;
      }
      renderQuestion(record);
    } catch (error) {
      console.error(error);
      bankPromise = null;
      markNotFound(input);
    } finally {
      [desktopBtn, mobileBtn].forEach(btn => {
        if (!btn) return;
        btn.disabled = false;
        btn.textContent = 'Search';
      });
    }
  }

  function bindSearch(input, button) {
    if (!input || !button) return;
    input.addEventListener('input', clearNotFoundState);
    input.addEventListener('keydown', event => {
      if (event.key === 'Enter') {
        event.preventDefault();
        searchQuestion(input, button);
      }
    });
    button.addEventListener('click', () => searchQuestion(input, button));
  }

  bindSearch(desktopInput, desktopBtn);
  bindSearch(mobileInput, mobileBtn);

  window.teacherBack = function() {
    window.location.href = 'main.html';
  };

  /* Reuse the test-screen image viewer interaction. */
  window.openExhibit = function(src) {
    const exhibit = document.getElementById('exhibitModal');
    const img = document.getElementById('exhibitImage');
    if (!exhibit || !img || !src) return;
    img.src = src;
    currentZoom = 1;
    img.style.transform = 'scale(1)';
    exhibit.classList.add('active');
  };
  window.closeExhibit = function() { document.getElementById('exhibitModal')?.classList.remove('active'); };
  window.zoomExhibitIn = function() { currentZoom = Math.min(4, currentZoom + .25); applyZoom(); };
  window.zoomExhibitOut = function() { currentZoom = Math.max(.5, currentZoom - .25); applyZoom(); };
  window.resetExhibitZoom = function() {
    currentZoom = 1; applyZoom();
    const body = document.getElementById('exhibitScrollBody');
    if (body) { body.scrollTop = 0; body.scrollLeft = 0; }
  };
  function applyZoom() {
    const img = document.getElementById('exhibitImage');
    if (img) img.style.transform = `scale(${currentZoom})`;
  }
  document.addEventListener('click', event => {
    if (event.target?.tagName === 'IMG' && !event.target.closest('#exhibitModal')) {
      const src = event.target.getAttribute('src');
      if (src) openExhibit(src);
    }
  });

  /* Pre-index the complete question bank; the QID field is immediately writable. */
  if ('requestIdleCallback' in window) requestIdleCallback(() => buildBank().catch(() => {}), { timeout: 1200 });
  else setTimeout(() => buildBank().catch(() => {}), 300);
})();
</script>
